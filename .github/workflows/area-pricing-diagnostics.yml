name: Area Pricing Diagnostics

on:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/area-pricing-diagnostics.yml'
      - 'Modules/PrintingServices/**'
      - 'Modules/Orders/**'
      - 'Modules/Finance/**'
      - 'Modules/Production/**'
      - 'Modules/Deliveries/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phpunit-direct:
    name: Isolated direct PHPUnit diagnosis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, pdo_mysql, bcmath
          tools: composer:v2
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: |
          cp .env.example .env
          php artisan key:generate --force
          php -r 'foreach (["bcmath", "pdo_sqlite"] as $e) { echo "$e: " . (extension_loaded($e) ? "yes" : "NO") . PHP_EOL; }'
      - name: Area unit tests - direct PHPUnit
        continue-on-error: true
        run: php -d display_errors=1 -d log_errors=1 vendor/bin/phpunit Modules/PrintingServices/tests/Unit/AreaPriceCalculatorTest.php --display-errors --display-warnings --debug
      - name: Existing printing prices - direct PHPUnit
        continue-on-error: true
        run: php -d display_errors=1 -d log_errors=1 vendor/bin/phpunit Modules/PrintingServices/tests/Feature/PrintingServicesPricingTest.php --display-errors --display-warnings --debug
      - name: Area feature tests - direct PHPUnit
        continue-on-error: true
        run: php -d display_errors=1 -d log_errors=1 vendor/bin/phpunit Modules/PrintingServices/tests/Feature/PrintingServicesAreaPricingTest.php --display-errors --display-warnings --debug
      - name: Area order tests - direct PHPUnit
        continue-on-error: true
        run: php -d display_errors=1 -d log_errors=1 vendor/bin/phpunit Modules/Orders/tests/Feature/OrdersAreaPricingTest.php --display-errors --display-warnings --debug
      - name: CORS isolated - direct PHPUnit
        continue-on-error: true
        run: php -d display_errors=1 -d log_errors=1 vendor/bin/phpunit tests/Feature/CorsTest.php --display-errors --display-warnings --debug
